name: Bug report
description: Something in the room is not behaving.
body:
  - type: markdown
    attributes:
      value: Keep personal room links, recovery codes and private notes out of this report. Security issue? Email me@aidenjang.com instead.
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Use a disposable room. Which seat were you using?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone, or Chrome on desktop
    validations:
      required: true
