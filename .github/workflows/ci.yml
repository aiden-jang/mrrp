name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm <name>` is not `pnpm run <name>`: where pnpm has a command of its own it wins and
      # the script is unreachable. This checks the whole chain, and that verify matches CI.
      - run: pnpm run gates
      - run: pnpm run size
      - run: pnpm run comments
      - run: pnpm run css-vars
      # `s.typo` is undefined, which React renders as no class at all: the element appears, unstyled,
      # and nothing errors. The room's date disclosure sat like that.
      - run: pnpm run css-classes
      - run: pnpm run docs
      - run: pnpm run typecheck
      # react-hooks/rules-of-hooks is why this step exists. A hook below an early return is invisible
      # to typecheck, build and tests, and it took every group page in owewell down in production.
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm run test
      # The layer nothing else sees: whether two people reach the same room and get their own half
      # of it, in a browser, against the real Worker and Durable Object.
      - name: Install Playwright browser
        run: pnpm --filter @mrrp/web exec playwright install --with-deps chromium
      - run: pnpm run e2e
      # --prod on purpose: what ships is hono and the auth client, and both are clean. Build
      # tooling carries advisories that never reach a browser or the Worker at request time, and
      # blocking on those is a light everyone learns to scroll past.
      - run: pnpm audit --prod --audit-level moderate

  # Auto-deploy to Cloudflare on merge to main, only after the checks above pass.
  # Requires a CLOUDFLARE_API_TOKEN repo secret (Workers-scoped). Wrangler infers the
  # account from the token, so no account_id is needed here.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-mrrp
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One Worker serves both the API and the built web app, so there is nothing to deploy
      # separately. The worker's own deploy script builds packages/web first, because
      # packages/web/dist is gitignored and this is a fresh checkout.
      #
      # No D1 here. Room state lives in a Durable Object, and its migration is declared in
      # wrangler.toml, so it is applied by this deploy rather than by a manual step.
      - name: Deploy to Cloudflare
        run: pnpm run deploy
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
