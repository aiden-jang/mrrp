name = "mrrp"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Served only on the custom domain. The whole thing is one private link sent to one person, so there is
# no reason for a second guessable *.workers.dev address to exist for it.
workers_dev = false

# The built web app is served by this same Worker, so the room link is one clean URL.
[assets]
directory = "../web/dist"
binding = "ASSETS"

# One instance per room. It holds one hibernatable WebSocket per open tab, so an idle room with two
# phones asleep on it costs nothing and still wakes to push. One alarm, which does the two things
# that must happen a week later whether or not anybody comes back: erasing a deleted room, and
# dropping the side of it somebody left.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Optional sign-in only. A room is a link and two seats; an account just remembers which seat is
# yours, so the auth service being unreachable is indistinguishable from never having signed in.
[vars]
AUTH_URL = "https://accounts.aidenjang.com"

# Keyless and free, which is why the window can show her real weather at all. A binding rather than a
# constant so the tests can point it at a port that refuses and never call a stranger's API.
WEATHER_URL = "https://api.open-meteo.com/v1/forecast"

[observability]
enabled = true

# Custom domain. Requires the aidenjang.com zone on this Cloudflare account; provisioned on deploy.
[[routes]]
pattern = "mrrp.aidenjang.com"
custom_domain = true
