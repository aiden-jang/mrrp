name = "mrrp"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Serve only on the custom domain.
workers_dev = false

# The built web app is served by this same Worker, so the room link is one clean URL.
[assets]
directory = "../web/dist"
binding = "ASSETS"

# One hibernatable Durable Object per room. Its alarm erases deleted rooms and expires departed seats.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Sign-in remembers seats; existing private-link access also works when Accounts is unavailable.
[vars]
AUTH_URL = "https://accounts.aidenjang.com"

# WEATHER_URL is configurable so tests can disable external weather requests.
WEATHER_URL = "https://api.open-meteo.com/v1/forecast"

[observability]
enabled = true

# Custom domain. Requires the aidenjang.com zone on this Cloudflare account; provisioned on deploy.
[[routes]]
pattern = "mrrp.aidenjang.com"
custom_domain = true
