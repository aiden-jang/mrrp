name = "sunspot"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# The built web app is served by this same Worker, so the room link is one clean URL.
[assets]
directory = "../web/dist"
binding = "ASSETS"

# One instance per room. No alarms, no WebSockets: state only moves when somebody visits.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
